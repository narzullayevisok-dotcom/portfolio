<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HarfPay</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg-1:#0b0c14;
  --bg-2:#141726;
  --accent-1:#6d5efc;
  --accent-2:#8f7bff;
  --accent-glow: rgba(109,94,252,.45);
  --green:#3ddc84;
  --red:#ff5c7a;
  --amber:#ffb547;
  --glass: rgba(255,255,255,.06);
  --glass-border: rgba(255,255,255,.12);
  --text-1:#f4f4fb;
  --text-2:#a7abc3;
  --text-3:#6a6e8a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  height:100%;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(109,94,252,.25), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(143,123,255,.18), transparent 55%),
    var(--bg-1);
  color:var(--text-1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
#app{ max-width:520px; margin:0 auto; min-height:100vh; padding:16px 16px 96px; position:relative; }

::-webkit-scrollbar{ width:0; height:0; }

.glass{
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius:20px;
}
.card{ padding:18px; margin-bottom:14px; }
.hstack{ display:flex; align-items:center; }
.spacer{ flex:1; }

/* Header */
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:6px 2px 18px; }
.brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; letter-spacing:.2px; }
.brand .dot{ width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); box-shadow:0 0 14px var(--accent-glow); }
.mode-switch{ display:flex; gap:6px; }
.mode-btn{
  font-size:12px; font-weight:700; padding:8px 12px; border-radius:12px; cursor:pointer;
  background:var(--glass); border:1px solid var(--glass-border); color:var(--text-2);
  transition:.2s;
}
.mode-btn.active{ color:#fff; background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); border-color:transparent; box-shadow:0 6px 18px var(--accent-glow); }

/* Profile hero */
.hero{
  background:linear-gradient(135deg, var(--accent-1), #4b3bd6 70%);
  border-radius:24px; padding:22px; margin-bottom:16px; position:relative; overflow:hidden;
  box-shadow: 0 20px 40px -18px rgba(109,94,252,.55);
}
.hero::after{
  content:""; position:absolute; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.25), transparent 65%);
  top:-90px; right:-60px;
}
.hero .label{ font-size:13px; opacity:.85; font-weight:600; }
.hero .amount{ font-size:34px; font-weight:800; margin:6px 0 16px; }
.hero .amount span{ font-size:17px; font-weight:600; opacity:.85; }
.btn{
  border:none; border-radius:14px; padding:14px 18px; font-weight:700; font-size:15px;
  cursor:pointer; transition:.15s transform,.15s box-shadow; width:100%;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#fff; box-shadow:0 10px 24px -8px var(--accent-glow); }
.btn-white{ background:#fff; color:var(--accent-1); }
.btn-ghost{ background:var(--glass); color:var(--text-1); border:1px solid var(--glass-border); }
.btn-danger{ background:linear-gradient(135deg,#ff5c7a,#c93b58); color:#fff; }
.btn-green{ background:linear-gradient(135deg,#3ddc84,#26a866); color:#032b16; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* tabs */
.tabs{ display:flex; gap:8px; margin-bottom:16px; background:var(--glass); border:1px solid var(--glass-border); padding:5px; border-radius:16px; }
.tab{ flex:1; text-align:center; padding:10px; border-radius:12px; font-size:13px; font-weight:700; color:var(--text-2); cursor:pointer; }
.tab.active{ background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#fff; }

h2.section-title{ font-size:15px; font-weight:800; margin:6px 0 12px; color:var(--text-1); }

/* task card */
.task{ display:flex; align-items:center; gap:14px; padding:16px; margin-bottom:12px; }
.task .letter-box{
  width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:800; background:linear-gradient(135deg, rgba(109,94,252,.35), rgba(143,123,255,.15));
  border:1px solid var(--glass-border);
}
.task .info{ flex:1; min-width:0; }
.task .name{ font-weight:700; font-size:15px; }
.task .cat{ font-size:11px; color:var(--text-3); letter-spacing:.6px; text-transform:uppercase; margin-top:2px; }
.task .price{ text-align:right; }
.task .price .som{ color:var(--green); font-weight:800; font-size:15px; }
.task .price .unit{ font-size:11px; color:var(--text-3); }
.task.done{ opacity:.5; }
.task-btn{ margin-top:10px; }

/* draw screen */
.draw-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.draw-top .chip{ background:var(--glass); border:1px solid var(--glass-border); border-radius:12px; padding:8px 12px; font-size:12px; font-weight:700; color:var(--text-2); }
.canvas-wrap{ background:#fff; border-radius:22px; overflow:hidden; margin-bottom:16px; box-shadow:0 20px 40px -16px rgba(0,0,0,.5); }
canvas{ display:block; touch-action:none; width:100%; height:340px; }
.draw-actions{ display:flex; gap:10px; }
.icon-btn{ width:52px; height:52px; border-radius:16px; background:var(--glass); border:1px solid var(--glass-border); color:var(--text-1); font-size:20px; cursor:pointer; }

/* stats */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.stat-box{ padding:18px; text-align:left; }
.stat-box .num{ font-size:24px; font-weight:800; }
.stat-box .lbl{ font-size:12px; color:var(--text-2); margin-top:4px; }
.level-row{ display:flex; align-items:center; gap:14px; padding:18px; }
.level-ring{ width:48px; height:48px; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(109,94,252,.7), rgba(109,94,252,.15)); }

/* withdraw */
.avail{ text-align:center; padding:22px; }
.avail .lbl{ color:var(--text-2); font-size:13px; }
.avail .num{ font-size:34px; font-weight:800; margin-top:6px; }
.seg{ display:flex; gap:8px; margin-bottom:14px; }
.seg-btn{ flex:1; padding:12px; border-radius:14px; text-align:center; font-weight:700; font-size:13px; cursor:pointer; background:var(--glass); border:1px solid var(--glass-border); color:var(--text-2); }
.seg-btn.active{ background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#fff; }
input[type=text], input[type=number], input[type=tel], textarea, select{
  width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--glass-border);
  background:rgba(255,255,255,.04); color:var(--text-1); font-size:15px; margin-bottom:10px; outline:none;
}
input::placeholder{ color:var(--text-3); }
.bank-row{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:14px; border:1px solid var(--glass-border); background:rgba(255,255,255,.03); margin-bottom:10px; cursor:pointer; }
.bank-row.active{ border-color:var(--accent-1); background:rgba(109,94,252,.12); }
.bank-row .ico{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; }
.bank-row .radio{ margin-left:auto; width:18px; height:18px; border-radius:50%; border:2px solid var(--glass-border); }
.bank-row.active .radio{ border-color:var(--accent-1); background:radial-gradient(circle,var(--accent-1) 40%, transparent 44%); }
.hint{ font-size:12px; color:var(--text-3); text-align:center; margin-top:10px; }

/* modal + toast */
.overlay{ position:fixed; inset:0; background:rgba(6,7,14,.72); backdrop-filter:blur(6px); display:flex; align-items:flex-end; justify-content:center; z-index:60; }
.overlay.center{ align-items:center; padding:16px; }
.sheet{ width:100%; max-width:520px; background:var(--bg-2); border:1px solid var(--glass-border); border-radius:26px 26px 0 0; padding:22px 18px 28px; }
.overlay.center .sheet{ border-radius:24px; }
.sheet .title{ font-size:17px; font-weight:800; margin-bottom:8px; }
.sheet .desc{ font-size:14px; color:var(--text-2); line-height:1.5; margin-bottom:18px; }
.channel-row{ display:flex; align-items:center; gap:10px; padding:14px; border-radius:14px; background:var(--glass); border:1px solid var(--glass-border); margin-bottom:10px; }
.channel-row .name{ flex:1; font-weight:700; font-size:14px; }

.toast{ position:fixed; left:16px; right:16px; bottom:96px; z-index:70; }
.toast-inner{ padding:16px 18px; border-radius:16px; font-size:14px; font-weight:600; text-align:center; box-shadow:0 14px 30px -12px rgba(0,0,0,.6); }
.toast-success{ background:linear-gradient(135deg,#1c8a54,#0f6b3f); color:#eaffef; }
.toast-error{ background:linear-gradient(135deg,#a8324a,#7c2038); color:#ffecef; }
.toast-info{ background:linear-gradient(135deg,#3a3f66,#2a2d4d); color:#eef; }

/* bottom nav */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:linear-gradient(0deg, rgba(11,12,20,.98), rgba(11,12,20,.9));
  border-top:1px solid var(--glass-border);
  padding:10px 18px calc(10px + env(safe-area-inset-bottom));
}
.nav-inner{ max-width:520px; margin:0 auto; display:flex; justify-content:space-around; }
.nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-3); font-size:11px; font-weight:700; cursor:pointer; }
.nav-item.active{ color:var(--accent-2); }
.nav-item .ic{ font-size:19px; }

/* admin */
.admin-menu{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.admin-menu .item{ padding:16px; text-align:center; cursor:pointer; font-weight:700; font-size:13px; }
.admin-menu .item.active{ border-color:var(--accent-1); background:rgba(109,94,252,.12); }
.req-card{ padding:16px; margin-bottom:12px; }
.req-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
.req-name{ font-weight:800; font-size:15px; }
.req-sub{ font-size:12px; color:var(--text-3); margin-top:2px; }
.req-amount{ font-size:18px; font-weight:800; color:var(--green); }
.badge{ font-size:10px; font-weight:800; padding:4px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.4px; }
.badge-pending{ background:rgba(255,181,71,.18); color:var(--amber); }
.badge-paid{ background:rgba(61,220,132,.18); color:var(--green); }
.badge-rejected{ background:rgba(255,92,122,.18); color:var(--red); }
.req-detail{ font-size:13px; color:var(--text-2); margin:10px 0; line-height:1.6; }
.req-actions{ display:flex; gap:8px; margin-top:10px; }
.req-actions .btn{ padding:11px; font-size:13px; }
.list-row{ display:flex; align-items:center; gap:10px; padding:14px; border-radius:14px; background:var(--glass); border:1px solid var(--glass-border); margin-bottom:10px; }
.list-row .grow{ flex:1; min-width:0; }
.list-row .title2{ font-weight:700; font-size:14px; }
.list-row .sub2{ font-size:12px; color:var(--text-3); margin-top:2px; }
.x-btn{ width:34px; height:34px; border-radius:10px; background:rgba(255,92,122,.15); color:var(--red); border:none; font-weight:800; cursor:pointer; }
.form-label{ font-size:12px; font-weight:700; color:var(--text-2); margin:10px 0 6px; }
.perm-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.perm-chip{ padding:10px; border-radius:12px; text-align:center; font-size:12px; font-weight:700; background:var(--glass); border:1px solid var(--glass-border); cursor:pointer; color:var(--text-2); }
.perm-chip.on{ background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#fff; border-color:transparent; }
.empty{ text-align:center; padding:40px 10px; color:var(--text-3); font-size:14px; }
.loader{ display:flex; align-items:center; justify-content:center; height:70vh; }
.spin{ width:38px; height:38px; border-radius:50%; border:3px solid rgba(255,255,255,.15); border-top-color:var(--accent-2); animation:sp 0.8s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   FIREBASE + TELEGRAM INIT
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCtJClnuNMGQDTmndOKqeJjg-QAw3JybZg",
  authDomain: "harf-c01ff.firebaseapp.com",
  databaseURL: "https://harf-c01ff-default-rtdb.firebaseio.com",
  projectId: "harf-c01ff",
  storageBucket: "harf-c01ff.firebasestorage.app",
  messagingSenderId: "165746750174",
  appId: "1:165746750174:web:7786cb6da0e834678f084f"
};
firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database();

// Backend API manzili — bot.py qayerda ishga tushirilgan bo'lsa, o'sha manzil
const API_BASE = "https://your-server-domain.example";

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const MAIN_ADMIN_ID = 7158658026;
const MIN_WITHDRAW = 75000;

let CURRENT_USER = null;     // {id, first_name, ...}
let TG_USER = null;          // telegram raw
let PERMS = { is_admin:false, is_main_admin:false, permissions:{} };
let VIEW_MODE = "user";      // 'user' | 'admin'
let TAB = "tasks";           // user tabs: tasks | stats | profile
let ADMIN_TAB = "requests";  // admin tabs
let currentTask = null;
let drawing = false, ctx = null, canvasEl = null;
let heartbeatTimer = null;

/* ============================================================
   YORDAMCHI FUNKSIYALAR
============================================================ */
function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function showToast(text, type="info"){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const t = el(`<div class="toast"><div class="toast-inner toast-${type}">${text}</div></div>`);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
async function apiGet(path, params){
  const url = new URL(API_BASE + path);
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.detail || "Xatolik yuz berdi");
  return data;
}
async function apiPost(path, body){
  const res = await fetch(API_BASE + path, {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.detail || "Xatolik yuz berdi");
  return data;
}

/* 20 ta harf/shrift vazifasi shabloni */
const TASK_TEMPLATES = [
  {letter:"O", name:"O'zbekcha (Bosma)", cat:"Asosiy"},
  {letter:"B", name:"O'zbekcha (Yozma)", cat:"Qo'lyozma"},
  {letter:"文", name:"Xitoycha (Ierogliflar)", cat:"Asosiy"},
  {letter:"ع", name:"Arabcha (Bog'langan)", cat:"Kalligrafiya"},
  {letter:"L", name:"Polyakcha (Lotin)", cat:"Diakritikli"},
  {letter:"Қ", name:"Qozoqcha (Kirill)", cat:"Kengaytirilgan"},
  {letter:"Ж", name:"Ruscha (Kursiv)", cat:"Qo'lyozma"},
  {letter:"Ş", name:"Turkcha (Lotin)", cat:"Diakritikli"},
  {letter:"あ", name:"Yaponcha (Hiragana)", cat:"Murakkab"},
  {letter:"한", name:"Koreyscha (Hangul)", cat:"Murakkab"},
  {letter:"Ω", name:"Grekcha (Klassik)", cat:"Akademik"},
  {letter:"Ä", name:"Nemischa (Umlaut)", cat:"Diakritikli"},
  {letter:"É", name:"Fransuzcha (Aksan)", cat:"Diakritikli"},
  {letter:"Ñ", name:"Ispancha (Tilde)", cat:"Diakritikli"},
  {letter:"א", name:"Ibroniycha", cat:"Kalligrafiya"},
  {letter:"ก", name:"Tailandcha", cat:"Murakkab"},
  {letter:"P", name:"Vetnamcha (Ohang)", cat:"Diakritikli"},
  {letter:"Đ", name:"Xorvatcha", cat:"Kengaytirilgan"},
  {letter:"Ø", name:"Daniyalcha", cat:"Kengaytirilgan"},
  {letter:"Å", name:"Shvedcha", cat:"Kengaytirilgan"},
];

function generateTasksIfNeeded(userData){
  if (userData.tasks && Object.keys(userData.tasks).length === TASK_TEMPLATES.length){
    return userData.tasks;
  }
  const tasks = {};
  TASK_TEMPLATES.forEach((tpl, i)=>{
    const price = Math.round((150000 + Math.random()*600000)/1000)*1000;
    tasks["t"+i] = {
      letter: tpl.letter, name: tpl.name, cat: tpl.cat,
      price, per_unit: Math.round(price/30/100)*100,
      completed: false, completed_at: null
    };
  });
  rtdb.ref('users/'+CURRENT_USER.id+'/tasks').set(tasks);
  return tasks;
}

/* ============================================================
   FOYDALANUVCHINI YUKLASH (bir marta yoziladi, keyin faqat o'qiladi)
============================================================ */
async function bootstrap(){
  TG_USER = tg?.initDataUnsafe?.user || { id: 999999999, first_name: "Mehmon", username:"" };
  const userRef = rtdb.ref('users/'+TG_USER.id);
  const snap = await userRef.get();

  if (!snap.exists()){
    const fresh = {
      id: TG_USER.id,
      first_name: TG_USER.first_name || "Foydalanuvchi",
      username: TG_USER.username || "",
      balance: 0, total_earned: 0, total_time_seconds: 0,
      is_banned: false,
      created_at: new Date().toISOString(),
      last_active: new Date().toISOString(),
      tasks: {}
    };
    await userRef.set(fresh);
    CURRENT_USER = fresh;
  } else {
    CURRENT_USER = snap.val();
    userRef.update({ last_active: new Date().toISOString() });
  }
  CURRENT_USER.tasks = generateTasksIfNeeded(CURRENT_USER);

  // ruxsatlarni tekshirish
  try{ PERMS = await apiGet('/api/permissions', {user_id: CURRENT_USER.id}); }
  catch(e){ PERMS = {is_admin: CURRENT_USER.id===MAIN_ADMIN_ID, is_main_admin: CURRENT_USER.id===MAIN_ADMIN_ID, permissions:{}}; }

  // real-vaqt tinglovchi — balans va boshqa o'zgarishlar uchun
  userRef.on('value', (s)=>{
    if (!s.exists()) return;
    const fresh = s.val();
    CURRENT_USER.balance = fresh.balance;
    CURRENT_USER.total_earned = fresh.total_earned;
    CURRENT_USER.tasks = fresh.tasks || CURRENT_USER.tasks;
    if (["tasks","profile","stats"].includes(TAB) && VIEW_MODE==='user') render();
  });

  startHeartbeat();
  render();
}

function startHeartbeat(){
  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(()=>{
    apiPost('/api/heartbeat', {user_id: CURRENT_USER.id, seconds: 30}).catch(()=>{});
  }, 30000);
}

/* ============================================================
   RENDER — asosiy router
============================================================ */
function render(){
  const app = document.getElementById('app');
  if (!CURRENT_USER){ app.innerHTML = `<div class="loader"><div class="spin"></div></div>`; return; }

  let body = "";
  if (VIEW_MODE === 'admin' && PERMS.is_admin){
    body = renderAdmin();
  } else {
    if (TAB==='tasks') body = currentTask ? renderDrawScreen() : renderTasksTab();
    else if (TAB==='stats') body = renderStatsTab();
    else body = renderProfileTab();
  }

  app.innerHTML = `
    ${renderTopbar()}
    ${body}
    ${!currentTask ? renderBottomNav() : ""}
  `;
  attachHandlers();
}

function renderTopbar(){
  if (!PERMS.is_admin) return `
    <div class="topbar">
      <div class="brand"><span class="dot"></span> HarfPay 🇺🇿</div>
    </div>`;
  return `
    <div class="topbar">
      <div class="brand"><span class="dot"></span> HarfPay 🇺🇿</div>
      <div class="mode-switch">
        <div class="mode-btn ${VIEW_MODE==='user'?'active':''}" data-act="mode-user">Foydalanuvchi</div>
        <div class="mode-btn ${VIEW_MODE==='admin'?'active':''}" data-act="mode-admin">Admin panel</div>
      </div>
    </div>`;
}

function renderBottomNav(){
  const items = [
    {k:'tasks', ic:'💼', lb:'Topshiriqlar'},
    {k:'stats', ic:'📊', lb:'Statistika'},
    {k:'profile', ic:'👤', lb:'Profil'},
  ];
  return `<div class="bottom-nav"><div class="nav-inner">
    ${items.map(i=>`
      <div class="nav-item ${TAB===i.k?'active':''}" data-act="tab" data-tab="${i.k}">
        <div class="ic">${i.ic}</div><div>${i.lb}</div>
      </div>`).join('')}
  </div></div>`;
}

/* ---------------- USER: TASKS TAB ---------------- */
function renderTasksTab(){
  const tasks = Object.entries(CURRENT_USER.tasks||{});
  const doneCount = tasks.filter(([,t])=>t.completed).length;
  return `
    <div class="hero">
      <div class="label">Sizning balansingiz</div>
      <div class="amount">${fmt(CURRENT_USER.balance)} <span>so'm</span></div>
      <button class="btn btn-white" data-act="tab" data-tab="profile">💳 Pul yechib olish</button>
    </div>

function setupCanvas(letter){
  canvasEl = document.getElementById('drawCanvas');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvasEl.getBoundingClientRect();
  canvasEl.width = rect.width*dpr; canvasEl.height = 340*dpr;
  ctx = canvasEl.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,rect.width,340);
  ctx.font = "260px Georgia, serif";
  ctx.fillStyle = "rgba(0,0,0,.08)";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(letter, rect.width/2, 175);
  ctx.strokeStyle = "#111"; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.lineJoin = "round";

  let drawingNow=false, last=null;
  const pos = (e)=>{
    const r = canvasEl.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = (e)=>{ drawingNow=true; last=pos(e); e.preventDefault(); };
  const move = (e)=>{
    if(!drawingNow) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; e.preventDefault();
  };
  const end = ()=>{ drawingNow=false; };
  canvasEl.addEventListener('mousedown', start); canvasEl.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvasEl.addEventListener('touchstart', start, {passive:false}); canvasEl.addEventListener('touchmove', move, {passive:false}); canvasEl.addEventListener('touchend', end);
  canvasEl._letter = letter; canvasEl._rectW = rect.width;
}

async function handleWithdrawSubmit(){
  const requisite = document.getElementById('wdRequisite').value.trim();
  const amount = parseInt(document.getElementById('wdAmount').value || "0", 10);

  if (withdrawMethod==='card'){
    const digits = requisite.replace(/\D/g,'');
    if (digits.length !== 16){ showToast("Karta raqami aniq 16 ta raqamdan iborat bo'lishi kerak", "error"); return; }
  } else {
    const digits = requisite.replace(/\D/g,'');
    if (digits.length !== 12 || !digits.startsWith('998')){ showToast("Telefon raqam 998 bilan boshlanuvchi 12 ta raqam bo'lishi kerak", "error"); return; }
  }
  if (!amount || amount < MIN_WITHDRAW){ showToast(`Minimal summa ${fmt(MIN_WITHDRAW)} so'm`, "error"); return; }
  if (amount > CURRENT_USER.balance){ showToast("Balansingiz yetarli emas", "error"); return; }

  showModal(`<div style="text-align:center; padding:20px 0;"><div class="spin" style="margin:0 auto 14px;"></div>Obuna tekshirilmoqda...</div>`, false);
  try{
    const sub = await apiGet('/api/check-subscription', {user_id: CURRENT_USER.id});
    if (!sub.subscribed){
      renderSubscribeModal(sub.missing);
      return;
    }
    closeModal();
    const res = await apiPost('/api/withdraw-request', {
      user_id: CURRENT_USER.id, amount, method: withdrawMethod,
      requisite, bank: withdrawMethod==='phone' ? selectedBank : null
    });
    showToast("✅ So'rovingiz qabul qilindi! Admin tez orada ko'rib chiqadi.", "success");
    document.getElementById('wdAmount').value = '';
    document.getElementById('wdRequisite').value = '';
  }catch(e){
    closeModal();
    showToast(e.message, "error");
  }
}

/* ============================================================
   EVENT HANDLERS
============================================================ */
function attachHandlers(){
  document.querySelectorAll('[data-act]').forEach(node=>{
    node.onclick = async (e)=>{
      const act = node.dataset.act;
      try{
        if (act==='tab'){ TAB = node.dataset.tab; currentTask=null; render(); }
        else if (act==='mode-user'){ VIEW_MODE='user'; render(); }
        else if (act==='mode-admin'){ VIEW_MODE='admin'; ADMIN_TAB='requests'; render(); loadAdminData(); }
        else if (act==='admin-tab'){ ADMIN_TAB=node.dataset.t; render(); if(ADMIN_TAB!=='ads') loadAdminData(); }
        else if (act==='open-task'){ openTask(node.dataset.id); }
        else if (act==='clear-canvas'){ setupCanvas(canvasEl._letter); }
        else if (act==='finish-task'){ finishTask(); }
        else if (act==='cancel-task'){ currentTask=null; render(); }
        else if (act==='wd-method'){ withdrawMethod=node.dataset.m; render(); }
        else if (act==='wd-bank'){ selectedBank=node.dataset.b; render(); }
        else if (act==='wd-submit'){ handleWithdrawSubmit(); }
        else if (act==='recheck-sub'){ closeModal(); handleWithdrawSubmit(); }
        else if (act==='wd-paid'){ processWithdraw(node.dataset.id,'paid'); }
        else if (act==='wd-reject'){ processWithdraw(node.dataset.id,'rejected'); }
        else if (act==='wd-msg'){ promptMessageUser(node.dataset.id); }
        else if (act==='ch-type'){ newChannelType=node.dataset.v; document.getElementById('chTypeOpen').classList.toggle('active', newChannelType==='open'); document.getElementById('chTypeClosed').classList.toggle('active', newChannelType==='closed'); }
        else if (act==='ch-add'){ addChannel(); }
        else if (act==='ch-del'){ deleteChannel(node.dataset.id); }
        else if (act==='perm-toggle'){ const k=node.dataset.k; newAdminPerms[k]=!newAdminPerms[k]; render(); }
        else if (act==='admin-add'){ addAdmin(); }
        else if (act==='admin-del'){ deleteAdmin(node.dataset.id); }
        else if (act==='ad-type'){ newAdType=node.dataset.v; render(); }
        else if (act==='ad-add'){ addAd(); }
        else if (act==='ad-del'){ deleteAd(node.dataset.id); }
      }catch(err){ showToast(err.message || "Xatolik", "error"); }
    };
  });
}

function openTask(id){
  const t = CURRENT_USER.tasks[id];
  if (t.completed) return;
  const idx = Object.keys(CURRENT_USER.tasks).indexOf(id);
  currentTask = { id, t, idx };
  render();
  setTimeout(()=>setupCanvas(t.letter), 30);
}

async function finishTask(){
  const { id, t } = currentTask;
  const path = `users/${CURRENT_USER.id}/tasks/${id}`;
  await rtdb.ref(path).update({ completed:true, completed_at: new Date().toISOString() });
  await rtdb.ref(`users/${CURRENT_USER.id}`).update({
    balance: (CURRENT_USER.balance||0) + t.price,
    total_earned: (CURRENT_USER.total_earned||0) + t.price,
  });
  currentTask = null;
  render();
  showToast("🎉 Vazifa bajarildi, hisobingizga pul qo'shildi!", "success");
}

  let note = "";
  if (action==='rejected'){ note = prompt("Rad etish sababi (ixtiyoriy):") || ""; }
  await apiPost('/api/admin/process-withdraw', { admin_id: CURRENT_USER.id, request_id:id, action, note, notify:true });
  showToast(action==='paid' ? "✅ To'lov tasdiqlandi" : "❌ So'rov rad etildi", "success");
  loadAdminData();
}

  const text = prompt("Foydalanuvchiga yuboriladigan xabar matnini kiriting:");

  await apiPost('/api/admin/message-user', { admin_id: CURRENT_USER.id, user_id: parseInt(userId), text });

}
